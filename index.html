<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pizza Workshop Classic</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="gameArea">

    <header class="hud">

        <div class="box">
            TIME
            <span id="time">30</span>
        </div>

        <div class="box">
            COMPLETED
            <span id="count">0</span>
        </div>

    </header>

    <div class="character">

        <div class="chef">👨‍🍳</div>

        <div id="message">
            STARTを押してゲーム開始！
        </div>

    </div>

    <button id="startBtn">
        START
    </button>

    <canvas
        id="canvas"
        width="900"
        height="500"></canvas>

</div>

<div id="resultScreen" class="hidden">

    <h1>TIME UP!</h1>

    <p>完成したピザ</p>

    <div id="finalCount">0</div>

    <button id="retryBtn">
        RETRY
    </button>

</div>

<script src="script.js"></script>
</body>
</html>
