<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizza Master</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>🍕 Pizza Master</h1>

    <div class="hud">
        <div>TIME: <span id="time">30</span></div>
        <div>SCORE: <span id="score">0</span></div>
    </div>

    <canvas id="game" width="700" height="500"></canvas>

    <div id="message">
        生地をドラッグして伸ばそう！
    </div>

    <button id="restart" hidden>
        PLAY AGAIN
    </button>

</div>

<script src="script.js"></script>
</body>
</html>
