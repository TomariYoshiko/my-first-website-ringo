<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pizza Toss Classic</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="top-area">

    <div class="hud-stat">
        TIME
        <span id="time">60</span>
    </div>

    <div class="message" id="message">
        STARTを押そう！
    </div>

    <button id="startBtn">
        START
    </button>

    <div class="power-area">
        <div class="power-bar">
            <div id="powerFill"></div>
        </div>
    </div>

    <div class="hud-stat">
        PIZZAS
        <span id="pizzas">0</span>
    </div>

</div>

<canvas
    id="gameCanvas"
    width="900"
    height="650">
</canvas>

<div id="resultScreen" class="hidden">

    <h1>TIME UP!</h1>

    <p>完成したピザ</p>

    <div id="resultCount">
        0
    </div>

    <button id="retryBtn">
        RETRY
    </button>

</div>

<script src="script.js"></script>

</body>
</html>
